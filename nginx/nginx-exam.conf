# ====================================================================
# 區域網路上機考試版 nginx 設定 (容器內的 oj-nginx 使用)
# --------------------------------------------------------------------
# 由 docker-compose.exam.yaml 掛載，一般模式不會用到這份。
# 與 nginx.conf 的差別: 信任 Windows 本機 nginx 傳進來的 X-Real-IP，
# 把 $remote_addr 還原成學生電腦的真實 IP，再交給 Django。
# ====================================================================

upstream oj {
    # oj-web名稱必須一樣(定義在docker-compose.yaml)
    server oj-web:8000;
}

server {

    listen 80;

    server_tokens off;

    client_max_body_size 20m;

    # 只信任來自 Docker Desktop 內部轉發位址的 X-Real-IP 標頭
    # (Windows 本機 nginx 連 127.0.0.1:8080 時，容器看到的來源會是這些內部網段)
    # 注意: 不可加入 192.168.0.0/24，那是學生電腦的網段
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.65.0/24;
    real_ip_header X-Real-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 444;
    }
    location ~* ^/(vendor|containers|wp-admin|wp-login|wp-content|phpmyadmin|xmlrpc) {
        return 444;
    }

    location / {
        proxy_pass http://oj;
        # 經過 real_ip 還原後，$remote_addr 已是學生電腦的真實 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
        proxy_set_header Host $host;
    }

    location ^~ /static/ {
        autoindex off;
        alias /app/staticfiles/;
    }

    location ~ /\. {
        deny all;
    }

}
