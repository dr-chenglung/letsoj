# ====================================================================
# Windows 本機 nginx 設定 (區域網路上機考試用)
# --------------------------------------------------------------------
# 把這個檔案覆蓋到 nginx for Windows 解壓目錄下的 conf\nginx.conf
# 角色: 最外層入口，直接在 Windows 上接收學生連線，因此看得到真實 IP，
#       再轉給 Docker 裡的 oj-nginx (127.0.0.1:8080)。
# ====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server_tokens off;

    # 只轉發不讀檔，但仍保留 mime 設定避免警告
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 20m;

    server {
        listen 80;

        location / {
            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            # 用學生電腦的真實 IP 覆寫，不沿用瀏覽器自帶的標頭，避免被偽造
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_redirect off;
        }
    }
}
